<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="64" height="64" rx="16" fill="url(#glow)"/>
  <!-- Clock outer ring -->
  <circle cx="32" cy="32" r="18" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>
  <!-- Clock tick marks -->
  <line x1="32" y1="15" x2="32" y2="18" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="49" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="32" x2="18" y2="32" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="49" y2="32" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing up-left ~10 o'clock) -->
  <line x1="32" y1="32" x2="25" y2="24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing right ~3 o'clock) -->
  <line x1="32" y1="32" x2="42" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="white"/>
  <!-- Spark / lightning accent (bottom right) -->
  <path d="M44 42 L40 50 L43 50 L39 58 L50 47 L46 47 Z" fill="rgba(255,255,255,0.9)" transform="scale(0.55) translate(32, 22)"/>
</svg>
